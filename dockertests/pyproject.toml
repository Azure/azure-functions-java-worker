[project]
name = "azure-functions-java-worker-docker-tests"
version = "0.1.0"
description = "Docker-based integration tests for Azure Functions Java Worker"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.0.0",
    "azure-storage-blob>=12.19.0",
    "requests>=2.31.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*", "!TestEnvironment"]
addopts = ["-v", "--tb=short"]
