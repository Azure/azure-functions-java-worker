schedules:
  - cron: "0 5 * * *"
    displayName: Nightly Build
    branches:
      include:
        - dev
    always: true

trigger:
  batch: true
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-windows-2022
      os: windows
      ${{ if eq( variables['Build.Reason'], 'Schedule' ) }}:
        demands:
        - Priority -equals Low

    sdl:
      codeql:
        compiled:
          enabled: true # still only runs for default branch
        language: java,powershell,csharp
        buildIdentifier: java_worker_public
        excludePathPatterns: extract/inst

    settings:
      # PR's from forks do not have sufficient permissions to set tags.
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
      - stage: Build
        jobs:
          - template: /eng/ci/templates/jobs/build.yml@self

      - stage: TestWindows
        dependsOn: []
        jobs:
          - template: /eng/ci/templates/jobs/run-emulated-tests-windows.yml@self
            parameters:
              poolName: 1es-pool-azfunc-public

      - stage: TestLinux
        dependsOn: []
        jobs:
          - template: /eng/ci/templates/jobs/run-emulated-tests-linux.yml@self
            parameters:
              poolName: 1es-pool-azfunc-public

      - stage: TestDocker
        dependsOn: []
        jobs:
          - template: /eng/ci/templates/jobs/run-docker-tests-windows.yml@self
            parameters:
              poolName: 1es-pool-azfunc-public