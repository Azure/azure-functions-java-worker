parameters:
  - name: poolName
    type: string
    default: ''

jobs:
  - job: "TestLinux"
    displayName: 'Test java worker - Linux'

    pool:
      name: ${{ parameters.poolName }}
      image: 1es-ubuntu-22.04
      os: linux

    variables:
      - template: ../java-versions.yml
      - ${{ if contains(variables['Build.SourceBranch'], '/tags/' ) }}:
        - name: isTagTemp
          value: true
      - name: isTag
        value: $[variables.isTagTemp]

    strategy:
      maxParallel: 5
      matrix:
        open-jdk-8-linux:
          JDK_DOWNLOAD_LINK: 'https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u$(JDK8_LINUX_VERSION)-b$(JDK8_LINUX_BUILD)/OpenJDK8U-jdk_x64_linux_hotspot_8u$(JDK8_LINUX_VERSION)b$(JDK8_LINUX_BUILD).tar.gz'
          JAVA_VERSION: 'OpenJDK8U-jdk_x64_linux_hotspot_8u$(JDK8_LINUX_VERSION)b$(JDK8_LINUX_BUILD)'
          JAVA_VERSION_SPEC: '8'
        microsoft-open-jdk-11-linux:
          JDK_DOWNLOAD_LINK: 'https://aka.ms/download-jdk/microsoft-jdk-$(JDK11_LINUX_VERSION)-linux-x64.tar.gz'
          JAVA_VERSION: 'microsoft-jdk-$(JDK11_LINUX_VERSION)-linux-x64'
          JAVA_VERSION_SPEC: '11'
        microsoft-open-jdk-17-linux:
          JDK_DOWNLOAD_LINK: 'https://aka.ms/download-jdk/microsoft-jdk-$(JDK17_LINUX_VERSION)-linux-x64.tar.gz'
          JAVA_VERSION: 'microsoft-jdk-$(JDK17_LINUX_VERSION)-linux-x64'
          JAVA_VERSION_SPEC: '17'
        microsoft-open-jdk-21-linux:
          JDK_DOWNLOAD_LINK: 'https://aka.ms/download-jdk/microsoft-jdk-$(JDK21_LINUX_VERSION)-linux-x64.tar.gz'
          JAVA_VERSION: 'microsoft-jdk-$(JDK21_LINUX_VERSION)-linux-x64'
          JAVA_VERSION_SPEC: '21'
        microsoft-open-jdk-25-linux:
          JDK_DOWNLOAD_LINK: 'https://aka.ms/download-jdk/microsoft-jdk-$(JDK25_LINUX_VERSION)-linux-x64.tar.gz'
          JAVA_VERSION: 'microsoft-jdk-$(JDK25_LINUX_VERSION)-linux-x64'
          JAVA_VERSION_SPEC: '25'

    steps:
      # Maven resolves plugins and extensions before a pom's repositories are honored. Install the
      # mirror before MavenAuthenticate@0, which adds credentials to the same settings file.
      - pwsh: |
          $m2 = Join-Path $HOME '.m2'
          New-Item -ItemType Directory -Path $m2 -Force | Out-Null
          Copy-Item '$(Build.SourcesDirectory)/settings.xml' (Join-Path $m2 'settings.xml') -Force
        displayName: 'Install Maven settings.xml'
      - task: MavenAuthenticate@0
        displayName: 'Authenticate Maven to CFS'
        inputs:
          artifactsFeeds: upstream-public
      - bash: |
          echo "=== disk BEFORE cleanup ==="
          df -h /
          echo "=== top consumers on / (baseline) ==="
          sudo du -xh --max-depth=2 / 2>/dev/null | sort -rh | head -20 || true
          echo "=== freeing space (toolsets this job does not use) ==="
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy 2>/dev/null || true
          docker image prune -af || true
          sudo apt-get clean || true
          echo "=== disk AFTER cleanup ==="
          df -h /
        displayName: 'Free up disk space'
      - task: NuGetToolInstaller@1
        inputs:
          checkLatest: true
        displayName: 'Install NuGet Tool'
      - pwsh: |
          Get-Command mvn
        displayName: 'Check Maven is installed'
      - task: JavaToolInstaller@0 # This step is necessary as Linux image has Java 11 as default
        inputs:
          versionSpec: '8'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'
        displayName: 'Setup Java for Linux'
      - pwsh: |
          java -version
        displayName: 'Check default java version'
      - task: UseDotNet@2
        displayName: 'Install .NET 6'
        inputs:
          version: 6.0.x
      - pwsh: | # Download JDK for later installation
          Invoke-WebRequest $(JDK_DOWNLOAD_LINK) -OutFile "$(JAVA_VERSION).tar.gz"
          $current = get-location | select -ExpandProperty Path
          Write-Host "##vso[task.setvariable variable=downloadPath;]$current"
        displayName: 'Download jdk for Linux'
      - task: JavaToolInstaller@0 # Install JDK downloaded from previous task
        inputs:
          versionSpec: $(JAVA_VERSION_SPEC)
          jdkArchitectureOption: 'x64'
          jdkSourceOption: LocalDirectory
          jdkFile: "$(downloadPath)/$(JAVA_VERSION).tar.gz"
          jdkDestinationDirectory: "$(downloadPath)/externals"
          cleanDestinationDirectory: true
        displayName: 'Setup Java for Linux'
      - task: npmAuthenticate@0
        inputs:
          workingFile: '$(Build.SourcesDirectory)/.npmrc'
        displayName: 'Authenticate npm to CFS'
      - bash: |
          npm install -g azurite
          mkdir azurite
          azurite --skipApiVersionCheck --silent --location azurite --debug azurite/debug.log &
        displayName: 'Install and Run Azurite'
        env:
          NPM_CONFIG_USERCONFIG: '$(Build.SourcesDirectory)/.npmrc'
      - pwsh: |
          if ("$(isTag)"){
            $buildNumber="$(Build.SourceBranchName)"
            Write-Host "Found git tag."
          }
          else {
            $buildNumber="$(Build.BuildNumber)-v4"
            Write-Host "git tag not found. Setting package suffix to '$buildNumber'"
          }
          Write-Host "##vso[task.setvariable variable=buildNumber;isOutput=true;]$buildNumber"
          .\package-pipeline.ps1 -buildNumber $buildNumber
        displayName: 'Executing build script'
      - pwsh: |
          # Download Mozilla CA certificate bundle
          Invoke-WebRequest -Uri "https://curl.se/ca/cacert.pem" -OutFile "./emulatedtests/confluent_cloud_cacert.pem"
          cd ./emulatedtests
          mvn clean package `-Dmaven`.javadoc`.skip=true `-Dmaven`.test`.skip `-Dorg`.slf4j`.simpleLogger`.log`.org`.apache`.maven`.cli`.transfer`.Slf4jMavenTransferListener=warn `-B
          Copy-Item "confluent_cloud_cacert.pem" "./target/azure-functions/azure-functions-java-emulatedtests"
        displayName: 'Download CA Bundle & Package Java for Emulated Tests'
      - task: npmAuthenticate@0
        inputs:
          workingFile: '$(Build.SourcesDirectory)/.npmrc'
        displayName: 'Authenticate npm to CFS'
      - pwsh: |
          .\setup-tests-pipeline.ps1
        displayName: 'Setup test environment -- Install the Core Tools'
        env:
          NPM_CONFIG_USERCONFIG: '$(Build.SourcesDirectory)/.npmrc'
      - bash: |
          chmod +x ./Azure.Functions.Cli/func
          chmod +x ./Azure.Functions.Cli/gozip
          export PATH=$PATH:./Azure.Functions.Cli
          func --version
        displayName: 'Setup Core Tools - Linux'
      - task: NuGetAuthenticate@1
        displayName: 'Authenticate NuGet to CFS'
      - task: DotNetCoreCLI@2
        retryCountOnTaskFailure: 3
        inputs:
          command: 'test'
          projects: |
            emulatedtests/Azure.Functions.Java.Tests.E2E/Azure.Functions.Java.Tests.E2E/Azure.Functions.Java.Tests.E2E.csproj
        env:
          AzureWebJobsStorage: "UseDevelopmentStorage=true"
        displayName: 'Build & Run tests'
        continueOnError: false
