parameters:
  - name: poolName
    type: string
    default: ''

jobs:
  - job: "TestDocker"
    displayName: 'Docker Integration Tests - Linux'

    pool:
      name: ${{ parameters.poolName }}
      image: 1es-ubuntu-24.04
      os: linux

    strategy:
      maxParallel: 4
      matrix:
        Java-8:
          javaVersion: '8'
        Java-11:
          javaVersion: '11'
        Java-17:
          javaVersion: '17'
        Java-21:
          javaVersion: '21'

    steps:
      # Maven resolves plugins and extensions before a pom's repositories are honored. Install the
      # mirror before MavenAuthenticate@0, which adds credentials to the same settings file.
      - pwsh: |
          $m2 = Join-Path $HOME '.m2'
          New-Item -ItemType Directory -Path $m2 -Force | Out-Null
          Copy-Item '$(Build.SourcesDirectory)/settings.xml' (Join-Path $m2 'settings.xml') -Force
        displayName: 'Install Maven settings.xml'
      - task: MavenAuthenticate@0
        displayName: 'Authenticate Maven to CFS'
        inputs:
          artifactsFeeds: upstream-public
      - bash: |
          set +e
          echo "=== disk ==="
          df -h /
          echo "=== toolchain ==="
          for t in mvn java javac docker python3 node npm dotnet; do
            printf '%-10s %s\n' "$t" "$(command -v $t 2>/dev/null || echo MISSING)"
          done
          echo "=== /opt/hostedtoolcache ==="
          ls -1 /opt/hostedtoolcache 2>/dev/null || echo "(absent)"
          echo "=== JDKs (/usr/lib/jvm) ==="
          ls -1 /usr/lib/jvm 2>/dev/null || echo "(none)"
          echo "=== docker daemon ==="
          docker info >/dev/null 2>&1 && echo "available" || echo "NOT available"
          exit 0
        displayName: 'Probe: disk + toolchain'

      - bash: |
          mvn --version
        displayName: 'Check Maven is installed'

      - bash: |
          java -version
        displayName: 'Check default java version'

      - task: JavaToolInstaller@0
        displayName: 'Install Java $(javaVersion)'
        inputs:
          versionSpec: '$(javaVersion)'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'

      - task: UsePythonVersion@0
        displayName: 'Use Python 3.11'
        inputs:
          versionSpec: '3.11'
          addToPath: true

      - task: PipAuthenticate@1
        displayName: 'Authenticate pip to CFS'
        inputs:
          artifactFeeds: 'public/upstream-public'
          onlyAddExtraIndex: false

      - bash: |
          python -m pip install --upgrade pip
          pip install -e dockertests/azure-functions-test-kit
        displayName: 'Install Python dependencies'

      - pwsh: |
          ./package-pipeline.ps1 -outputDir 'java-worker' -skipNuget
        displayName: 'Package Java worker'

      - pwsh: |
          cd dockertests
          ./build-apps.ps1
        displayName: 'Build and package test apps'

      - bash: |
          cd dockertests
          pytest . -v -n auto --tb=long
        displayName: 'Run Docker integration tests'
        env:
          FUNCTIONS_TEST_WORKER_DIR: '$(Build.SourcesDirectory)/java-worker'
          FUNCTIONS_TEST_USE_AZURITE: 'true'
          FUNCTIONS_TEST_RUNTIME: 'java'
          FUNCTIONS_TEST_RUNTIME_VERSION: '$(javaVersion)'
          FUNCTIONS_TEST_HOST_VERSION: '4'
          FUNCTIONS_TEST_APPS_DIR: '$(Build.SourcesDirectory)/dockertests/app-packages'
